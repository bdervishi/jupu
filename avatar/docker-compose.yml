# AdvoOS Avatar — Media-Server + Hermes (vLLM).
# Der Media-Server läuft auch ohne vLLM (Mock-LLM). Für echten Betrieb den
# vllm-Service aktivieren und LLM_BASE_URL=http://vllm:8000/v1 setzen.

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-NousResearch/Hermes-3-Llama-3.1-8B}
      - TTS_ENGINE=${TTS_ENGINE:-mock}
      - STT_ENABLED=${STT_ENABLED:-false}
      - AVATAR_ENABLED=${AVATAR_ENABLED:-false}
    # Für echte STT/TTS/Avatar-Modelle braucht dieser Service ebenfalls GPU:
    # deploy: { resources: { reservations: { devices: [{ capabilities: [gpu] }] } } }

  # Hermes über vLLM (OpenAI-kompatibel). Braucht NVIDIA-GPU.
  vllm:
    image: vllm/vllm-openai:latest
    profiles: ["gpu"]            # nur mit `--profile gpu` starten
    command: ["--model", "NousResearch/Hermes-3-Llama-3.1-8B", "--max-model-len", "8192"]
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
